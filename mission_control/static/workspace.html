<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T15 · Field workspace</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/workspace.css"><script src="/workspace.js" defer></script><link rel="stylesheet" href="/embedded.css"><script src="/embedded.js" defer></script><link rel="stylesheet" href="/team15-theme.css"><link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><meta name="theme-color" content="#0b0b0c"></head>
<body class="workspace-body">
<header class="topbar"><strong class="brand">T<span>15</span></strong><nav class="workspace-nav" aria-label="Dashboard views"><button data-view="overview" aria-pressed="true">Overview</button><button data-view="simulation" aria-pressed="false">Mission</button><button data-view="ble" aria-pressed="false">BLE signals</button><button data-view="vision" aria-pressed="false">Live vision</button><button data-view="decisions" aria-pressed="false">Decisions</button><button data-view="about" aria-pressed="false">How it works</button></nav><span class="top-spacer"></span><button id="workspace-session" class="quiet">Connect</button><button id="workspace-stop" class="danger" disabled>Stop + land</button><button id="workspace-reset-layout" class="quiet">Reset layout</button><button id="workspace-fullscreen" class="quiet">Fullscreen</button></header>
<div class="workspace-intro"><form id="workspace-login"><label for="workspace-token">Operator / viewer token</label><div class="workspace-login-row"><input id="workspace-token" type="password" autocomplete="off" placeholder="Connect to live feeds" required><button class="primary">Connect</button></div><span id="workspace-auth-status" role="status">Simulation is available without a token.</span></form></div>
<main id="view-grid" class="view-grid" aria-label="Mission overview">
<section class="view-card" data-panel="simulation"><div class="view-card-head"><button data-expand="simulation" aria-label="Expand mission animation">Expand ↗</button></div><iframe id="frame-simulation" title="Scripted drone, rover and report animation" src="/trace?embedded=1&amp;mission=1"></iframe></section>
<section class="view-card" data-panel="ble"><div class="view-card-head"><button data-expand="ble" aria-label="Expand BLE signals">Expand ↗</button></div><iframe id="frame-ble" title="BLE receiver and selected phone signal" src="/trace?embedded=1"></iframe></section>
<section class="view-card" data-panel="vision"><div class="view-card-head"><button data-expand="vision" aria-label="Expand live computer vision">Expand ↗</button></div><iframe id="frame-vision" title="Live camera and person detection" src="/vision?embedded=1" allow="camera 'self'"></iframe></section>
<section class="view-card" data-panel="decisions"><div class="view-card-head"><button data-expand="decisions" aria-label="Expand operator decisions">Expand ↗</button></div><iframe id="frame-decisions" title="Operator scenario exercises and live controls" src="/trace?embedded=1&amp;quiz=1"></iframe></section>
<div class="resize-handle workspace-resize-x" role="separator" tabindex="0" aria-label="Resize workspace columns" aria-orientation="vertical" data-resize-target="view-grid" data-resize-axis="x" data-resize-property="--workspace-split-x" data-resize-default="50" data-resize-min="15" data-resize-max="85"></div>
<div class="resize-handle workspace-resize-y" role="separator" tabindex="0" aria-label="Resize workspace rows" aria-orientation="horizontal" data-resize-target="view-grid" data-resize-axis="y" data-resize-property="--workspace-split-y" data-resize-default="50" data-resize-min="15" data-resize-max="85"></div>
</main><section id="about-stage" class="about-stage" aria-label="How the Team-15 system works" hidden><iframe id="frame-about" title="How the Team-15 system works" src="/about"></iframe></section><p id="workspace-notice" role="status" class="toast" hidden></p>
</body></html>
