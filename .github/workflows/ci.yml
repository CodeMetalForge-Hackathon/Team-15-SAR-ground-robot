name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Route CLI prints A→G 60 m
        run: python -m planner.route A G | python -c "import json,sys; r=json.load(sys.stdin); assert r['length_m']==60 and r['path']==list('ABCDEFG'), r; print(r)"
      - run: pytest -q
